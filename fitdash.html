<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitDash">
<meta name="theme-color" content="#0e0e10">
<title>FitDash</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10; --bg2: #17171a; --bg3: #1f1f23;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f0; --text2: #8a8a95; --text3: #555560;
  --accent: #c8f135; --accent2: #a8d020; --accent-dim: rgba(200,241,53,0.12);
  --red: #ff5f57; --blue: #4fa3e8; --blue-dim: rgba(79,163,232,0.12);
  --radius: 16px; --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --c-steps: #22c55e; --c-gym: #ef4444; --c-situps: #f97316;
  --c-pushups: #a78bfa; --c-pullups: #38bdf8; --c-reading: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 16px; overscroll-behavior: none; }
.app { max-width: 430px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; padding: 8px 12px calc(8px + var(--safe-bottom)); background: rgba(14,14,16,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; gap: 2px; z-index: 100; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; border: none; background: transparent; color: var(--text3); font-family: 'DM Sans', sans-serif; font-size: 10px; cursor: pointer; border-radius: var(--radius-sm); transition: all .2s; }
.nav-btn svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { filter: drop-shadow(0 0 5px var(--accent)); }
.scroll-area { flex: 1; overflow-y: auto; padding-top: calc(var(--safe-top) + 16px); padding-bottom: calc(80px + var(--safe-bottom)); -webkit-overflow-scrolling: touch; }
.view { display: none; padding: 0 14px; }
.view.active { display: block; }
.page-header { margin-bottom: 20px; }
.page-header.with-auth { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.auth-pill { display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 20px; padding: 5px 10px 5px 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; flex-shrink: 0; margin-top: 4px; }
.auth-pill img, .auth-pill .avatar-ph { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; background: var(--accent-dim); }
.auth-name { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; transition: background .3s; }
.sync-dot.ok { background: var(--accent); }
.sync-dot.syncing { background: var(--blue); animation: pulse 1s infinite; }
.sync-dot.error, .sync-dot.offline { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
.page-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 2px; font-family: 'DM Mono', monospace; }
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.card-title { font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card-title svg { width: 13px; height: 13px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
.stat-card { background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.stat-val { font-size: 24px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text); letter-spacing: -1px; line-height: 1; }
.stat-unit { font-size: 12px; color: var(--text2); font-weight: 400; font-family: 'DM Sans', sans-serif; letter-spacing: 0; }
.stat-card.accent { background: var(--accent-dim); border-color: rgba(200,241,53,0.2); }
.stat-card.accent .stat-val { color: var(--accent); }
.stat-card.blue { background: var(--blue-dim); border-color: rgba(79,163,232,0.2); }
.stat-card.blue .stat-val { color: var(--blue); }
input, select { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 10px 12px; width: 100%; outline: none; transition: border-color .2s; -webkit-appearance: none; }
input:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: var(--text3); }
select option { background: var(--bg3); }
.field-group { margin-bottom: 10px; }
.field-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; display: block; font-weight: 500; }
.field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-primary { width: 100%; padding: 12px; background: var(--accent); color: #0e0e10; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 4px; }
.btn-primary:active { transform: scale(0.98); background: var(--accent2); }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.todo-item:last-child { border-bottom: none; padding-bottom: 0; }
.todo-item:first-child { padding-top: 0; }
.todo-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .2s; }
.todo-check.done { background: var(--accent); border-color: var(--accent); }
.todo-check svg { width: 12px; height: 12px; stroke: #0e0e10; display: none; }
.todo-check.done svg { display: block; }
.todo-text { flex: 1; font-size: 14px; color: var(--text); transition: all .2s; line-height: 1.4; }
.todo-text.done { color: var(--text3); text-decoration: line-through; }
.todo-del { color: var(--text3); cursor: pointer; font-size: 20px; padding: 0 2px; line-height: 1; }
.todo-del:active { color: var(--red); }
.todo-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
.todo-input-row input { flex: 1; }
.todo-add-btn { padding: 10px 14px; background: var(--accent); color: #0e0e10; border: none; border-radius: var(--radius-sm); font-size: 20px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: all .15s; line-height: 1; }
.todo-add-btn:active { transform: scale(0.95); }
.gym-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.gym-tabs::-webkit-scrollbar { display: none; }
.gym-tab { padding: 6px 14px; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; border: 0.5px solid var(--border2); border-radius: 20px; background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; transition: all .15s; }
.gym-tab.active { background: var(--accent); color: #0e0e10; border-color: var(--accent); }
.log-entry { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.log-entry:last-child { border-bottom: none; padding-bottom: 0; }
.log-entry:first-child { padding-top: 0; }
.log-name { font-size: 14px; font-weight: 500; color: var(--text); }
.log-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; margin-top: 2px; }
.log-del { color: var(--text3); cursor: pointer; font-size: 18px; padding: 4px 0 4px 10px; }
.log-del:active { color: var(--red); }
.pr-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; background: var(--accent-dim); color: var(--accent); border-radius: 20px; margin-left: 6px; }
.bw-summary { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
.bw-main { font-size: 38px; font-weight: 600; font-family: 'DM Mono', monospace; letter-spacing: -2px; color: var(--accent); }
.bw-kg { font-size: 16px; color: var(--text2); margin-left: 4px; }
.bw-diff { font-size: 13px; color: var(--text2); font-family: 'DM Mono', monospace; }
.bw-diff.up { color: var(--red); }
.bw-diff.down { color: var(--accent); }
.bw-chart { display: flex; gap: 5px; align-items: flex-end; height: 80px; }
.bw-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.bw-bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent-dim); min-height: 4px; }
.bw-bar.latest { background: var(--accent); }
.bw-bar-label { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; white-space: nowrap; }
.empty { text-align: center; color: var(--text3); font-size: 13px; padding: 20px 0 6px; }
.section-divider { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; margin: 14px 0 8px; }

/* sets form */
.set-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.set-row:last-of-type { border-bottom: none; }
.set-num { width: 40px; font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; flex-shrink: 0; }
.set-orm { display: block; font-size: 9px; color: var(--accent); margin-top: 3px; white-space: nowrap; }
.set-row input { flex: 1; padding: 8px 10px; font-size: 14px; text-align: center; }
.set-row .rpe-in { flex: none; width: 56px; }
.set-del { color: var(--text3); cursor: pointer; font-size: 20px; width: 22px; text-align: center; flex-shrink: 0; line-height: 1; }
.set-del:active { color: var(--red); }
.add-set-btn { width: 100%; padding: 10px; background: transparent; border: 0.5px dashed var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; margin: 8px 0 0; transition: all .15s; }
.add-set-btn:active { background: var(--bg3); }
.sets-col-headers { display: flex; gap: 8px; padding: 0 0 6px; border-bottom: 0.5px solid var(--border); margin-bottom: 2px; }
.sets-col-headers .ch { flex: 1; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.sets-col-headers .ch-num { width: 40px; flex: none; }
.sets-col-headers .ch-del { width: 22px; flex: none; }
.sets-col-headers .ch-rpe { width: 56px; flex: none; text-align: center; }

/* streak badge */
.streak { font-size: 11px; color: var(--accent); font-family: 'DM Mono', monospace; white-space: nowrap; flex-shrink: 0; }

/* weekly summary */
.week-row { display: flex; gap: 3px; align-items: flex-end; margin-bottom: 12px; }
.week-day-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.week-day-label { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; }
.week-habit-dot { width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--bg3); transition: background .2s; }
.week-mini-stats { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
.week-stat { flex: 1; text-align: center; }
.week-stat-val { font-size: 20px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text); }
.week-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

/* progress chart in modal */
.prog-chart { display: flex; gap: 4px; align-items: flex-end; height: 90px; margin-top: 12px; }
.prog-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.prog-bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent-dim); min-height: 4px; transition: background .2s; }
.prog-bar.latest { background: var(--accent); }
.prog-bar-val { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; white-space: nowrap; }
.prog-bar-date { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; white-space: nowrap; }

/* calendar */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-month-label { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.cal-nav-btn { width: 34px; height: 34px; border: 0.5px solid var(--border2); border-radius: 50%; background: var(--bg3); color: var(--text2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.cal-nav-btn:active { background: var(--bg2); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
.cal-wd { text-align: center; font-size: 10px; color: var(--text3); font-weight: 500; padding: 4px 0; text-transform: uppercase; letter-spacing: .05em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; cursor: pointer; position: relative; transition: background .15s; overflow: hidden; }
.cal-day:active { opacity: .7; }
.cal-day.empty { pointer-events: none; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 600; }
.cal-day.future { opacity: .3; pointer-events: none; }
.cal-day-num { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; line-height: 1; z-index: 1; position: relative; }
.cal-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 3px; padding: 0 2px; z-index: 1; position: relative; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
.cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: flex-end; padding-bottom: var(--safe-bottom); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet { width: 100%; max-width: 430px; margin: 0 auto; background: var(--bg2); border-radius: 20px 20px 0 0; border-top: 0.5px solid var(--border2); padding: 20px 16px calc(20px + var(--safe-bottom)); max-height: 80dvh; overflow-y: auto; transform: translateY(30px); transition: transform .25s cubic-bezier(.4,0,.2,1); }
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
.modal-date { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; margin-bottom: 18px; }
.modal-section-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; margin: 14px 0 8px; }
.modal-habit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
.modal-habit-row:last-child { border-bottom: none; }
.modal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.modal-dot.off { background: var(--bg3); border: 1px solid var(--border2); }
.modal-ex-row { padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.modal-ex-row:last-child { border-bottom: none; }
.modal-ex-name { font-size: 14px; font-weight: 500; color: var(--text); }
.modal-ex-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; margin-top: 2px; }
.modal-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--bg3); border: 0.5px solid var(--border2); color: var(--text2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* pwa/offline */
.pwa-banner { margin: 0 14px 12px; background: var(--accent-dim); border: 0.5px solid rgba(200,241,53,0.25); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 12px; animation: slideDown .3s ease; }
@keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.pwa-banner-icon { font-size: 22px; flex-shrink: 0; }
.pwa-banner-text { flex: 1; }
.pwa-banner-title { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.pwa-banner-sub { font-size: 11px; color: var(--text2); line-height: 1.4; }
.pwa-banner-close { color: var(--text3); font-size: 18px; cursor: pointer; flex-shrink: 0; padding: 4px; line-height: 1; }
.offline-badge { position: fixed; top: calc(var(--safe-top) + 8px); left: 50%; transform: translateX(-50%); background: var(--red); color: white; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; z-index: 300; display: none; letter-spacing: .04em; }
.offline-badge.show { display: block; }
</style>
</head>
<body>
<div class="offline-badge" id="offline-badge">OFFLINE</div>
<div class="app">
  <div id="pwa-banner-container"></div>
  <div class="scroll-area">

    <!-- DASHBOARD -->
    <div class="view active" id="view-dashboard">
      <div class="page-header with-auth">
        <div>
          <div class="page-title" id="greeting">Good morning</div>
          <div class="page-sub" id="datestr"></div>
        </div>
        <div id="auth-slot"></div>
      </div>
      <div class="stat-grid" id="dash-stats"></div>
      <div class="card" id="weekly-card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          This week
        </div>
        <div id="weekly-summary"></div>
      </div>
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
          Today's habits
        </div>
        <div id="dash-todo-list"></div>
      </div>
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M3 12h18"/></svg>
          Recent gym
        </div>
        <div id="dash-gym-list"></div>
      </div>
    </div>

    <!-- HABITS -->
    <div class="view" id="view-todos">
      <div class="page-header">
        <div class="page-title">Daily habits</div>
        <div class="page-sub" id="todo-count-label"></div>
      </div>
      <div class="card" id="habits-card">
        <div id="habit-list"></div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:10px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add custom task
        </div>
        <div class="todo-input-row">
          <input id="todo-input" placeholder="One-off task..." onkeydown="if(event.key==='Enter')addTodo()">
          <button class="todo-add-btn" onclick="addTodo()">+</button>
        </div>
        <div id="todo-list"></div>
      </div>
    </div>

    <!-- GYM -->
    <div class="view" id="view-gym">
      <div class="page-header">
        <div class="page-title">Gym</div>
        <div class="page-sub" id="gym-date-label"></div>
      </div>
      <div class="gym-tabs">
        <button class="gym-tab active" onclick="switchGymTab('exercise',this)">Exercise</button>
        <button class="gym-tab" onclick="switchGymTab('cardio',this)">Cardio</button>
        <button class="gym-tab" onclick="switchGymTab('bodyweight',this)">Body weight</button>
      </div>
      <div id="gtab-exercise">
        <div class="card" id="ex-picker-card">
          <div class="card-title" style="margin-bottom:10px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Choose exercise
          </div>
          <div id="ex-muscle-tabs" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;"></div>
          <div id="ex-picker-list"></div>
          <div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border)">

const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndremFlYmJmaHl0dWF1aW9xanF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTY2NzgsImV4cCI6MjA5NTU3MjY3OH0.DyrWDmxKqFFhr_geNapCJMlhb2lrpVhCYEQvvGzGjMw';

async function sbAuthFetch(path, opts = {}) {

function getUserId() { return CURRENT_USER ? CURRENT_USER.id : null; }
function jwtExp(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp * 1000; } catch(e) { return 0; }
}

async function handleAuthRedirect() {
  const hash = window.location.hash;

  if (!token) return false;

  if (data && data.id) {
    CURRENT_USER = data;

    // offline: keep the session using the cached profile
    try { const u = JSON.parse(localStorage.getItem('fitdash_user')); if (u && u.id) { CURRENT_USER = u; return true; } } catch(e) {}
    return false;
  }

  return false;
}
let refreshing = null;
function tryRefreshSession() {
  if (!refreshing) refreshing = (async () => {
    const refresh_token = localStorage.getItem('fitdash_refresh_token');
    if (!refresh_token) return false;
    const data = await sbAuthFetch('token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token }) });
    if (data && data.access_token) {
      localStorage.setItem('fitdash_access_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('fitdash_refresh_token', data.refresh_token);
      return await loadSession(data.access_token);
    }
    if (data) { // refresh token rejected: session is really over
      localStorage.removeItem('fitdash_refresh_token'); localStorage.removeItem('fitdash_access_token');
      ACCESS_TOKEN = null; CURRENT_USER = null; showAuthUI();
    }
    return false;
  })().finally(() => { refreshing = null; });

}

  if (ACCESS_TOKEN && jwtExp(ACCESS_TOKEN) - Date.now() < 60000) await tryRefreshSession();
}
function signInWithGoogle() { window.location.href = `${SB_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(window.location.href.split('#')[0])}`; }

  ACCESS_TOKEN = null; CURRENT_USER = null;
  ['fitdash_access_token','fitdash_refresh_token','fitdash_user'].forEach(k => localStorage.removeItem(k));
  showAuthUI(); renderAll();
}

let syncState = '';

  }
}
function setSyncState(state) {
  syncState = state;

// ── STATE ────────────────────────────────────────────────
// Items carry id (string), c (created ms, for ordering) and t (last edit ms, newest wins).
// Deletes leave a tombstone in S.tomb; S.dirty lists records still to push.
const KEY = 'fitdash_v2';
const COLLS = ['exercises', 'cardio', 'bodyweights', 'todos'];
function emptyState() { return { exercises: [], cardio: [], bodyweights: [], todos: [], habits: {}, tomb: {}, dirty: {}, owner: null, lastPull: null, importedOld: false }; }
let S = emptyState();
function load() { try { const d = localStorage.getItem(KEY); if (d) S = { ...emptyState(), ...JSON.parse(d) }; } catch(e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function dateKey(ddmmyyyy) { return String(ddmmyyyy).split('/').reverse().join(''); }
function normDate(d) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : d; }
function markDirty(coll, id) { S.dirty[coll + '|' + id] = 1; }
function addItem(coll, item) { const n = Date.now(); item = { id: newId(), c: n, t: n, ...item }; S[coll].push(item); markDirty(coll, item.id); return item; }
function touchItem(coll, item) { item.t = Date.now(); markDirty(coll, item.id); }
function removeItem(coll, id) { S[coll] = S[coll].filter(x => x.id !== id); S.tomb[coll + '|' + id] = Date.now(); markDirty(coll, id); }
function sortAll() {
  const byDateThenCreated = (a, b) => dateKey(b.date).localeCompare(dateKey(a.date)) || (b.c || 0) - (a.c || 0);
  S.exercises.sort(byDateThenCreated); S.cardio.sort(byDateThenCreated); S.bodyweights.sort(byDateThenCreated);
  S.todos.sort((a, b) => (b.c || 0) - (a.c || 0));
}
function commit() { sortAll(); save(); renderAll(); scheduleSync(); }

function migrateV1() {
  if (localStorage.getItem(KEY)) return;
  let old = null;
  try { old = JSON.parse(localStorage.getItem('fitdash_v1')); } catch(e) {}
  if (old) {
    COLLS.forEach(coll => (old[coll] || []).forEach(it => {
      const { synced, _dirty, sb_id, id, ...rest } = it;
      const c = typeof id === 'number' && id > 1e12 ? id : 0;
      const nid = sb_id ? 'sb' + sb_id : String(id || newId());
      if (S[coll].some(x => x.id === nid)) return;
      S[coll].push({ ...rest, id: nid, c, t: c || 1 });
      markDirty(coll, nid);
    }));
  }
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('habits_')) continue;
    const date = k.slice(7);
    let ids = []; try { ids = JSON.parse(localStorage.getItem(k)) || []; } catch(e) {}
    ids.forEach(hid => { (S.habits[date] ||= {})[hid] = { v: true, t: 1 }; markDirty('habits', date + '~' + hid); });
  }
  sortAll(); save();
}
load(); migrateV1();

// ── SYNC ─────────────────────────────────────────────────
async function api(path, opts = {}, retry = true) {
  await ensureFreshToken();
  if (!ACCESS_TOKEN) throw new Error('signed out');
  const res = await fetch(SB_URL + '/rest/v1/' + path, { ...opts, headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + ACCESS_TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401 && retry && await tryRefreshSession()) return api(path, opts, false);
  if (!res.ok) throw new Error(res.status + ' ' + await res.text());
  const text = await res.text(); return text ? JSON.parse(text) : null;
}

function localT(coll, id) {
  if (coll === 'habits') { const j = id.lastIndexOf('~'); return S.habits[id.slice(0, j)]?.[id.slice(j + 1)]?.t || 0; }
  const it = S[coll]?.find(x => x.id === id);
  return it ? it.t : (S.tomb[coll + '|' + id] || 0);
}
function recordFor(key) {
  const i = key.indexOf('|'), coll = key.slice(0, i), id = key.slice(i + 1);
  if (coll === 'habits') {
    const j = id.lastIndexOf('~'), h = S.habits[id.slice(0, j)]?.[id.slice(j + 1)];
    return h ? { coll, id, data: { v: h.v }, t: h.t, del: false } : null;
  }
  const it = S[coll]?.find(x => x.id === id);
  if (it) { const { id: _, t, ...data } = it; return { coll, id, data, t, del: false }; }
  const tt = S.tomb[key];
  return tt ? { coll, id, data: null, t: tt, del: true } : null;
}
function applyRemote(r) {
  const key = r.coll + '|' + r.id, lt = localT(r.coll, r.id);
  if (r.t < lt) { S.dirty[key] = 1; return false; }
  if (r.t === lt) return false;
  if (r.coll === 'habits') {
    const j = r.id.lastIndexOf('~');
    (S.habits[r.id.slice(0, j)] ||= {})[r.id.slice(j + 1)] = { v: !!r.data?.v, t: r.t };
  } else if (COLLS.includes(r.coll)) {
    S[r.coll] = S[r.coll].filter(x => x.id !== r.id);
    if (r.del) S.tomb[key] = r.t;
    else { delete S.tomb[key]; S[r.coll].push({ ...r.data, id: r.id, t: r.t }); }
  } else return false;
  delete S.dirty[key];
  return true;
}

async function pull() {
  // 10 s overlap guards against rows committed slightly out of order; re-applying is harmless
  const from = S.lastPull ? new Date(Date.parse(S.lastPull) - 10000).toISOString() : null;
  let offset = 0, max = S.lastPull;
  for (;;) {
    const rows = await api(`fitdash_records?select=coll,id,data,t,del,updated_at${from ? '&updated_at=gt.' + encodeURIComponent(from) : ''}&order=updated_at.asc&limit=1000&offset=${offset}`);
    rows.forEach(r => { applyRemote(r); if (!max || Date.parse(r.updated_at) > Date.parse(max)) max = r.updated_at; });
    if (rows.length < 1000) break;
    offset += 1000;
  }
  S.lastPull = max;
}
async function push() {
  const keys = Object.keys(S.dirty);
  for (let i = 0; i < keys.length; i += 500) {
    const rows = keys.slice(i, i + 500).map(recordFor).filter(Boolean).map(r => ({ ...r, user_id: getUserId() }));
    if (rows.length) await api('fitdash_records?on_conflict=user_id,coll,id', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
    rows.forEach(r => { if (localT(r.coll, r.id) === r.t) delete S.dirty[r.coll + '|' + r.id]; });
  }
}
// One-time import of rows from the old per-table schema (exercises, cardio, …).
async function importOld() {
  const uid = getUserId();
  const get = t => api(`${t}?user_id=eq.${uid}&limit=5000`).catch(() => []);
  const [ex, ca, bw, td, hb] = await Promise.all(['exercises', 'cardio', 'bodyweights', 'todos', 'habits'].map(get));
  const add = (coll, id, data) => { if (localT(coll, id)) return; S[coll].push({ ...data, id, t: 1 }); markDirty(coll, id); };
  const c = r => Date.parse(r.created_at) || 0;
  ex.forEach(e => add('exercises', 'sb' + e.id, { name: e.name, sets: e.sets, reps: e.reps, weight: e.weight, pr: e.pr, date: normDate(e.date), c: c(e) }));
  ca.forEach(x => add('cardio', 'sb' + x.id, { type: x.type, dur: x.duration, dist: x.distance, date: normDate(x.date), c: c(x) }));
  bw.forEach(b => add('bodyweights', 'sb' + b.id, { val: b.val, date: normDate(b.date), c: c(b) }));
  td.forEach(x => add('todos', 'sb' + x.id, { text: x.text, done: x.done, date: normDate(x.date), c: c(x) }));
  hb.forEach(h => (h.habit_ids || []).forEach(hid => {
    const date = normDate(h.date), day = (S.habits[date] ||= {});
    if (!day[hid]) { day[hid] = { v: true, t: 1 }; markDirty('habits', date + '~' + hid); }
  }));
  S.importedOld = true;
}

// Local data made while signed out belongs to whoever signs in next;
// a different account on the same device gets its own copy.
function adoptOwner(uid) {
  if (S.owner === uid) return;
  if (S.owner) {
    try { localStorage.setItem(KEY + '_' + S.owner, JSON.stringify(S)); } catch(e) {}
    let stash = null; try { stash = JSON.parse(localStorage.getItem(KEY + '_' + uid)); } catch(e) {}
    S = stash ? { ...emptyState(), ...stash } : emptyState();
  }
  S.owner = uid;
  save(); renderAll();
}

let syncing = false, syncAgain = false, syncTimer = null;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 800); }
async function sync() {
  if (!getUserId()) return;
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { setSyncState('offline'); return; }
  syncing = true; setSyncState('syncing');
  try {
    await pull();
    if (!S.importedOld) await importOld();
    await push();
    sortAll(); save(); renderAll();
    setSyncState('ok');
  } catch(e) {
    console.warn('sync failed', e);
    setSyncState(navigator.onLine ? 'error' : 'offline');
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; sync(); }
}

window.addEventListener('offline', () => setSyncState('offline'));

  { id: 'steps',   label: '10,000 steps', icon: '👟', color: 'var(--c-steps)'   },
  { id: 'situps',  label: 'Sit-ups',      icon: '🔥', color: 'var(--c-situps)'  },

function getHabitsDoneFor(dateStr) { const day = S.habits[dateStr] || {}; return HABITS.map(h => h.id).filter(id => day[id]?.v); }
function todayStr() { return fmtDate(new Date()); }

function getHabitStreak(habitId) {
  let streak = 0;
  const today = new Date();
  let d = new Date(today);
  d.setDate(d.getDate() - 1);
  while (streak < 366) {
    if (getHabitsDoneFor(fmtDate(d)).includes(habitId)) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  if (getHabitsDoneFor(todayStr()).includes(habitId)) streak++;
  return streak;
}

// ── SETS STATE ───────────────────────────────────────────
let currentSets = [];

function calcEpley(reps, weight) {
  const w = parseFloat(weight), r = parseInt(reps);
  if (!w || !r || r >= 37) return null;
  if (r === 1) return w;
  return Math.round((w * (1 + r / 30)) * 10) / 10;
}

function addSet(reps, weight, focus = true) {
  currentSets.push({ reps: reps !== undefined ? reps : '', weight: weight !== undefined ? weight : '', rpe: '' });
  renderSetsList();
  if (focus) setTimeout(() => {
    const rows = document.querySelectorAll('.set-row');
    if (rows.length) rows[rows.length-1].querySelector('input').focus();
  }, 50);
}

function removeSet(idx) {
  currentSets.splice(idx, 1);
  renderSetsList();
}

function renderSetsList() {
  const el = document.getElementById('sets-list');
  if (!el) return;
  el.innerHTML = currentSets.map((s, i) => {
    const orm = calcEpley(s.reps, s.weight);
    return `
    <div class="set-row">
      <span class="set-num">Set ${i+1}<span class="set-orm">${orm ? '1RM ' + orm : ''}</span></span>
      <input type="number" inputmode="numeric" min="1" max="100" placeholder="reps" value="${s.reps}"
        oninput="onSetInput(${i},'reps',this)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();this.nextElementSibling.focus()}">
      <input type="number" inputmode="decimal" min="0" max="500" step="0.5" placeholder="kg" value="${s.weight}"
        oninput="onSetInput(${i},'weight',this)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();this.nextElementSibling.focus()}">
      <input type="number" inputmode="numeric" min="1" max="10" placeholder="RPE" value="${s.rpe}" class="rpe-in"
        oninput="onSetInput(${i},'rpe',this)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addSet()}">
      <span class="set-del" onclick="removeSet(${i})">×</span>
    </div>`;
  }).join('');
  const btn = document.getElementById('log-ex-btn');
  if (btn) btn.textContent = currentSets.length ? `Log exercise — ${currentSets.length} set${currentSets.length>1?'s':''}` : 'Log exercise';
}

// Update state and the row's 1RM in place; re-rendering here would steal focus from the input.
function onSetInput(i, field, input) {
  currentSets[i][field] = input.value;
  const orm = calcEpley(currentSets[i].reps, currentSets[i].weight);
  input.closest('.set-row').querySelector('.set-orm').textContent = orm ? '1RM ' + orm : '';
}

function logExercise() {
  const name = selectedExercise.trim();
  if (!name || !currentSets.length) { shake('sets-list'); return; }
  const validSets = currentSets.filter(s => parseInt(s.reps) > 0);
  if (!validSets.length) { shake('sets-list'); return; }
  const notes = (document.getElementById('ex-notes').value || '').trim();
  const maxWeight = Math.max(...validSets.map(s => parseFloat(s.weight) || 0));
  const prev = S.exercises.filter(e => e.name.toLowerCase() === name.toLowerCase());
  const prevMax = prev.length ? Math.max(...prev.map(e => {
    if (e.sets_data) return Math.max(...e.sets_data.map(s => parseFloat(s.weight)||0));
    return parseFloat(e.weight)||0;
  })) : 0;
  const pr = prev.length > 0 && maxWeight > prevMax; // a first-ever log is a baseline, not a PR
  addItem('exercises', {
    name, notes,
    sets_data: validSets.map(s => ({ reps: parseInt(s.reps)||0, weight: parseFloat(s.weight)||0, rpe: s.rpe ? parseInt(s.rpe) : null })),
    sets: validSets.length, reps: parseInt(validSets[0].reps)||0, weight: maxWeight,
    pr, date: todayStr()
  });
  clearExercisePicker();
  commit();
}

function deleteExercise(id) { removeItem('exercises', id); commit(); }

let expandedDays = new Set([todayStr()]);

function fmtSetsData(e) {
  if (e.sets_data && e.sets_data.length) {
    return e.sets_data.map(s => `${s.reps}${s.weight?' @'+s.weight+'kg':''}${s.rpe?' RPE'+s.rpe:''}`).join(' · ');

function showExerciseProgress(name) {
  const sessions = S.exercises
    .filter(e => e.name.toLowerCase() === name.toLowerCase())
    .sort((a, b) => a.date.split('/').reverse().join('').localeCompare(b.date.split('/').reverse().join('')))
    .slice(-10);
  if (!sessions.length) return;

  const maxWeightFor = e => e.sets_data ? Math.max(...e.sets_data.map(s => s.weight||0)) : (e.weight||0);
  const vals = sessions.map(maxWeightFor);
  const maxVal = Math.max(...vals) || 1;
  const totalSessions = S.exercises.filter(e => e.name.toLowerCase() === name.toLowerCase()).length;
  const allMax = Math.max(...S.exercises.filter(e => e.name.toLowerCase() === name.toLowerCase()).map(maxWeightFor));

  const bars = sessions.map((e, i) => {
    const w = maxWeightFor(e);
    const pct = Math.round(((w || 4) / maxVal) * 68) + 8;
    const isLatest = i === sessions.length - 1;
    const lbl = e.date.split('/').slice(0,2).join('/');
    return `<div class="prog-bar-wrap">
      <div class="prog-bar-val">${w||''}</div>
      <div class="prog-bar ${isLatest?'latest':''}" style="height:${pct}px"></div>
      <div class="prog-bar-date">${lbl}</div>
    </div>`;
  }).join('');

  document.getElementById('modal-date').textContent = name;
  document.getElementById('modal-sub').textContent = `${totalSessions} sessions · max ${allMax} kg`;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section-title">Max weight per session (last ${sessions.length})</div>
    <div class="prog-chart">${bars}</div>
    ${sessions[sessions.length-1]?.pr ? '<div style="margin-top:12px;font-size:13px;color:var(--accent)">🏅 Current weight is a PR</div>' : ''}`;
  document.getElementById('modal-overlay').classList.add('open');
}

  const diffStr = diff !== null ? (diff >= 0 ? '+' : '') + diff.toFixed(1) + ' kg' : '—';
  const diffClass = diff === null ? '' : diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  summary.innerHTML = `<div class="bw-summary"><div><span class="bw-main">${latest.val}</span><span class="bw-kg">kg</span></div><div class="bw-diff ${diffClass}">${diffStr} from last</div></div>`;

  const vals = data.map(d => d.val);
  const min = Math.min(...vals) - 2, max = Math.max(...vals) + 2, range = max - min || 1;
  chart.innerHTML = data.map((d, i) => {
    const pct = Math.round(((d.val - min) / range) * 68) + 8;

    const lbl = d.date.split('/').slice(0,2).join('/');

    ${gridRows}
    <div class="week-mini-stats">
      <div class="week-stat"><div class="week-stat-val">${gymDays}</div><div class="week-stat-label">Gym days</div></div>
      <div class="week-stat"><div class="week-stat-val">${weeklyPRs}</div><div class="week-stat-label">PRs</div></div>
      <div class="week-stat"><div class="week-stat-val">${avgHabits}</div><div class="week-stat-label">Avg habits</div></div>
    </div>`;
}

function renderDashboard() {
  const habitsDone = getHabitsDoneFor(todayStr());
  const todayEx = S.exercises.filter(e => e.date === todayStr()).length;
  const bw = S.bodyweights[0];
  const prs = S.exercises.filter(e => e.pr).length;
  const allDone = habitsDone.length === HABITS.length;

  let bwTrend7 = null;
  if (bw) {
    const d = new Date(); d.setDate(d.getDate() - 7);
    const base = S.bodyweights.find(b => dateKey(b.date) <= dateKey(fmtDate(d)));
    if (base) bwTrend7 = bw.val - base.val;
  }

  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card ${allDone ? 'accent' : ''}">
      <div class="stat-label">Habits done</div>
      <div class="stat-val">${habitsDone.length}<span class="stat-unit"> / ${HABITS.length}</span></div>
    </div>
    <div class="stat-card ${todayEx > 0 ? 'blue' : ''}">
      <div class="stat-label">Exercises today</div>
      <div class="stat-val">${todayEx}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Body weight</div>
      <div class="stat-val">${bw ? bw.val : '—'}<span class="stat-unit">${bw ? ' kg' : ''}</span></div>
      ${bwTrend7 !== null ? `<div style="font-size:10px;color:${bwTrend7 > 0 ? 'var(--red)' : 'var(--accent)'};margin-top:3px">${bwTrend7 > 0 ? '+' : ''}${bwTrend7.toFixed(1)} (7d)</div>` : ''}
    </div>
    <div class="stat-card ${prs > 0 ? 'accent' : ''}">
      <div class="stat-label">PRs set</div>
      <div class="stat-val">${prs}</div>
    </div>`;

  renderWeeklySummary();

  const tl = document.getElementById('dash-todo-list');
  tl.innerHTML = HABITS.map(h => {
    const isDone = habitsDone.includes(h.id);
    const streak = getHabitStreak(h.id);
    return `<div class="todo-item" onclick="toggleHabit('${h.id}')" style="cursor:pointer">
      <div class="todo-check ${isDone?'done':''}" role="checkbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span style="font-size:16px;flex-shrink:0">${h.icon}</span>
      <span class="todo-text ${isDone?'done':''}">${h.label}</span>
      ${streak >= 2 ? `<span class="streak">🔥 ${streak}</span>` : ''}
    </div>`;
  }).join('');

  const gl = document.getElementById('dash-gym-list');
  const recent = [
    ...S.exercises.slice(0, 3).map(e => ({ name: e.name + (e.pr ? ' 🏅' : ''), meta: `${fmtSetsData(e)} · ${e.date}` })),
    ...S.cardio.slice(0, 2).map(c => ({ name: c.type, meta: `${c.dur} min${c.dist?' · '+c.dist+' km':''} · ${c.date}` }))
  ].slice(0, 4);
  gl.innerHTML = recent.length ? recent.map(r => `<div class="log-entry"><div><div class="log-name">${escHtml(r.name)}</div><div class="log-meta">${r.meta}</div></div></div>`).join('') : '<div class="empty">No gym activity yet</div>';
}

let calYear, calMonth;
(function() { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); })();

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function calNext() {
  const now = new Date();
  if (calYear < now.getFullYear() || (calYear === now.getFullYear() && calMonth < now.getMonth())) {
    calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  }
}

function getDotsForDate(dateStr) {
  const dots = [];
  const habits = getHabitsDoneFor(dateStr);
  const META = { steps:'var(--c-steps)', situps:'var(--c-situps)', pushups:'var(--c-pushups)', pullups:'var(--c-pullups)', reading:'var(--c-reading)' };
  habits.forEach(id => { if (META[id]) dots.push(META[id]); });
  if (S.exercises.some(e => e.date === dateStr) || S.cardio.some(c => c.date === dateStr)) dots.push('var(--c-gym)');
  return dots;
}

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = monthNames[calMonth] + ' ' + calYear;
  const grid = document.getElementById('cal-grid');
  const now = new Date();
  const todayFmt = fmtDate(now);
  const firstDay = new Date(calYear, calMonth, 1);
  let startOffset = firstDay.getDay() - 1; if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < startOffset; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(calYear, calMonth, d);
    const dateStr = fmtDate(dateObj);
    const isToday = dateStr === todayFmt;
    const isFuture = dateObj > now && !isToday;
    const dots = getDotsForDate(dateStr);
    const dotsHtml = dots.map(c => `<div class="cal-dot" style="background:${c}"></div>`).join('');
    html += `<div class="cal-day${isToday?' today':''}${isFuture?' future':''}" onclick="openDayModal('${dateStr}')">
      <div class="cal-day-num">${d}</div>
      <div class="cal-dots">${dotsHtml}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

function openDayModal(dateStr) {
  const [dd, mm, yyyy] = dateStr.split('/');
  const dateObj = new Date(parseInt(yyyy), parseInt(mm)-1, parseInt(dd));
  const dayName = dateObj.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  document.getElementById('modal-date').textContent = dayName;
  const habits = getHabitsDoneFor(dateStr);
  const exercises = S.exercises.filter(e => e.date === dateStr);
  const cardios = S.cardio.filter(c => c.date === dateStr);
  const bwEntry = S.bodyweights.find(b => b.date === dateStr);
  document.getElementById('modal-sub').textContent = dateStr === todayStr() ? 'Today' : '';
  let body = '<div class="modal-section-title">Habits</div>';
  body += HABITS.map(h => {
    const done = habits.includes(h.id);
    return `<div class="modal-habit-row">
      <div class="modal-dot ${done?'':'off'}" style="${done?'background:'+h.color:''}"></div>
      <span style="font-size:16px">${h.icon}</span>
      <span style="color:${done?'var(--text)':'var(--text3)'};">${h.label}</span>
      ${done ? '<span style="margin-left:auto;font-size:11px;color:var(--text2)">✓</span>' : ''}
    </div>`;
  }).join('');
  if (exercises.length || cardios.length) {
    body += '<div class="modal-section-title">Gym session</div>';
    exercises.forEach(e => { body += `<div class="modal-ex-row"><div class="modal-ex-name">${escHtml(e.name)}${e.pr?'<span class="pr-badge">PR</span>':''}</div><div class="modal-ex-meta">${fmtSetsData(e)}${e.notes ? '<br style="margin-top:2px"><span style="font-style:italic;color:var(--text3)">"'+escHtml(e.notes)+'"</span>' : ''}</div></div>`; });
    cardios.forEach(c => { body += `<div class="modal-ex-row"><div class="modal-ex-name">${escHtml(c.type)}</div><div class="modal-ex-meta">${c.dur} min${c.dist?' · '+c.dist+' km':''}</div></div>`; });
  }
  if (bwEntry) body += `<div class="modal-section-title">Body weight</div><div class="modal-habit-row"><span style="font-size:22px;font-weight:600;font-family:DM Mono,monospace;color:var(--accent)">${bwEntry.val}</span><span style="color:var(--text2);margin-left:4px">kg</span></div>`;
  if (!habits.length && !exercises.length && !cardios.length && !bwEntry) body += '<div class="empty" style="padding:30px 0">No activity logged</div>';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });

function fmtDate(d) { return d.toLocaleDateString('en-GB'); }
function jsArg(v) { return escHtml(JSON.stringify(v)); }
function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shake(id) {
  const el = document.getElementById(id); if (!el) return;
  el.style.borderColor = 'var(--red)';
  let i = 0; const frames = [-5,5,-3,3,0];
  const go = () => { if (i >= frames.length) { el.style.transform=''; el.style.borderColor=''; return; } el.style.transform=`translateX(${frames[i]}px)`; i++; setTimeout(go,60); };
  go();
}

const EXERCISES_DB = {
  'Klata': ['Płaska ława','Skośna ławka','Skośna ławka hantle','Pec fly','Rozpiętki kable','Rozpiętki na ławce','Pompki','Pompki na podwyższeniu','Dipy'],
  'Barki': ['Żołnierskie','Żołnierskie hantle','Barki hantle boki','Face cable pull','Lean in cable pull'],
  'Triceps': ['Cable pull down','Triceps press','Overhead dumbbell triceps','Cable overhead triceps','Skull crushers','Dumbbell overhead triceps'],
  'Plecy': ['Pull-ups','Lat pull-down szerokie','Lat pull-down V-grip','Single arm lat pull-down','Wiosłowanie sztangą','Wiosłowanie z dołu','Low row','Low row dumbbell','One arm dumbbell row','Ławka rzymska'],
  'Biceps': ['Modlitewnik','Biceps kable','Spider curl','Single arm cable curl','Barbell curl'],
  'Nogi': ['Przysiad','Bułgary'],
  'Core': ['Leg raises','Plank','Wznosy nóg drążek','Myszkowe ćwiczenie'],
  'Inne': ['Martwy ciąg','Hex trap bar']
};

let selectedExercise = '';
let activeMuscleTab = Object.keys(EXERCISES_DB)[0];

function initExercisePicker() {
  const tabs = document.getElementById('ex-muscle-tabs');
  if (!tabs) return;
  tabs.innerHTML = Object.keys(EXERCISES_DB).map(m =>
    `<button class="gym-tab ${m === activeMuscleTab ? 'active' : ''}" onclick="switchMuscleTab(${jsArg(m)},this)">${escHtml(m)}</button>`
  ).join('');
  renderExercisePicker();
}

function switchMuscleTab(muscle, btn) {
  activeMuscleTab = muscle;
  document.querySelectorAll('#ex-muscle-tabs .gym-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderExercisePicker();
}

function renderExercisePicker() {
  const list = document.getElementById('ex-picker-list');
  if (!list) return;
  const exercises = EXERCISES_DB[activeMuscleTab] || [];
  list.innerHTML = exercises.map(ex => {
    const last = getLastLog(ex);
    return `<div onclick="selectExercise(${jsArg(ex)})" style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border);cursor:pointer;">
      <span style="font-size:14px;font-weight:500;color:var(--text)">${escHtml(ex)}</span>
      ${last ? `<span style="font-size:11px;color:var(--text3);font-family:DM Mono,monospace">${last}</span>` : ''}
    </div>`;
  }).join('');
}

function getLastLog(name) {
  const logs = S.exercises.filter(e => e.name.toLowerCase() === name.toLowerCase());
  if (!logs.length) return '';
  const last = logs[0];
  if (last.sets_data && last.sets_data.length) {
    const maxW = Math.max(...last.sets_data.map(s => s.weight||0));
    return `${last.sets_data.length}×${last.sets_data[0]?.reps||'?'}${maxW?' @'+maxW+'kg':''}`;
  }
  return `${last.sets}×${last.reps}${last.weight?' @'+last.weight+'kg':''}`;
}

function selectExercise(name) {
  selectedExercise = name;
  document.getElementById('ex-picker-card').style.display = 'none';
  document.getElementById('ex-log-form-card').style.display = 'block';
  document.getElementById('ex-selected-name').textContent = name;
  document.getElementById('ex-notes').value = '';
  const last = S.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
  const lastDiv = document.getElementById('ex-last-log');
  const lastText = document.getElementById('ex-last-log-text');
  currentSets = [];
  if (last) {
    if (last.sets_data && last.sets_data.length) {
      last.sets_data.forEach(s => addSet(s.reps, s.weight, false));
      lastText.textContent = last.sets_data.map((s,i) => `Set ${i+1}: ${s.reps} reps${s.weight?' @ '+s.weight+' kg':''}${s.rpe?' RPE'+s.rpe:''}`).join(' · ') + ' · ' + last.date;
    } else {
      for (let i = 0; i < (last.sets||1); i++) addSet(last.reps, last.weight, false);
      lastText.textContent = `${last.sets} × ${last.reps} reps${last.weight?' @ '+last.weight+' kg':''} · ${last.date}`;
    }
    lastDiv.style.display = 'block';
  } else {
    addSet();
    lastDiv.style.display = 'none';
  }
}

function confirmCustomExercise() {
  const val = (document.getElementById('ex-name-custom').value || '').trim();
  if (!val) return;
  selectedExercise = val;
  document.getElementById('ex-picker-card').style.display = 'none';
  document.getElementById('ex-log-form-card').style.display = 'block';
  document.getElementById('ex-selected-name').textContent = val;
  document.getElementById('ex-last-log').style.display = 'none';
  document.getElementById('ex-notes').value = '';
  currentSets = [];
  addSet();
}

function clearExercisePicker() {
  selectedExercise = '';
  currentSets = [];
  document.getElementById('ex-picker-card').style.display = 'block';
  document.getElementById('ex-log-form-card').style.display = 'none';
  document.getElementById('ex-name-custom').value = '';
  document.getElementById('ex-notes').value = '';
  renderSetsList();
}

initDateTime();
initExercisePicker();
renderAll();
showAuthUI();

(async function init() {
  const redirected = await handleAuthRedirect();
  if (!redirected) {
    const token = localStorage.getItem('fitdash_access_token');
    if (token && !(await loadSession(token))) await tryRefreshSession();
    else if (!token) await tryRefreshSession();
  }
  showAuthUI();
  if (getUserId()) { adoptOwner(getUserId()); sync(); }
})();
</script>
